[package]
name = "ctxviz"
version = "0.1.0"
edition = "2021"
description = "Live context visualizer for interactive Cursor CLI sessions"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vykluong/ctxviz"
homepage = "https://github.com/vykluong/ctxviz"
readme = "README.md"
keywords = ["cursor", "context", "tui", "kitty", "statusline"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ratatui = "0.30"
crossterm = "0.29"
md5 = "0.8"
terminal-colorsaurus = "1.0.3"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
