# cargo-deny configuration (schema for cargo-deny 0.18+; generated from the
# 0.20.2 template and trimmed). Run with `cargo deny check`.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check all targets (Linux, macOS, Windows) rather than only the host.
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Vulnerability advisories are always errors in this schema version.
# Unmaintained and unsound advisories fail for crates we depend on directly.
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Only licenses that the resolved dependency graph actually requires. Crates
# offered under an `OR` expression only need one allowed option.
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
